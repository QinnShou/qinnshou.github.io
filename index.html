<div class="app">

<script>
(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});
const rooms=[
  {id:'all',name:'全屋概览',icon:'⌂',sub:'完整户型',x:7.3,y:5.35,zoom:1,description:'从客餐厅到三间独立空间，沿原图布局探索整个家。'},
  {id:'living',name:'客厅',icon:'◫',sub:'沙发 · 茶几 · 电视',x:7.65,y:7.35,zoom:1.65,description:'开放式客厅位于户型中央，连接餐厅、书房与卧室。'},
  {id:'dining',name:'餐厨区',icon:'◉',sub:'六人餐桌 · L 型厨房',x:6.6,y:2.45,zoom:1.55,description:'餐桌紧邻厨房；水槽、灶台、冰箱和洗衣区按图示位置还原。'},

  {id:'secondary',name:'次卧',icon:'▧',sub:'1.5 米宽床',x:12.15,y:2.15,zoom:1.85,description:'右上角次卧，床宽按照图上可辨识的 1.5 米标注。'},
  {id:'bath',name:'卫生间',icon:'◍',sub:'浴缸 · 洗手台',x:12.1,y:5,zoom:1.8,description:'次卧与主卧之间的卫生间，包含浴缸、坐便器和洗手台。'},
  {id:'master',name:'主卧',icon:'▥',sub:'1.8 米宽床',x:12.15,y:8.15,zoom:1.75,description:'右下角主卧，床宽按照图上可辨识的 1.8 米标注。'}
];
document.querySelector('#rooms').innerHTML=rooms.map((r,i)=>`<button type="button" class="room${i===0?' active':''}" data-room="${r.id}"><span class="icon">${r.icon}</span><span><strong>${r.name}</strong><small>${r.sub}</small></span><span class="arrow">›</span></button>`).join('');
const cam={yaw:-.55,pitch:.94,zoom:1,x:7.3,y:5.35},target={...cam};let width=0,height=0,dpr=1,fullWalls=false,furniture=true,labels=true,active='all',topMode=false,drag=null,pinchDist=0;
const faces=[],labelPoints=[];

function face(v,c,type='solid',alpha=1){faces.push({v,c,type,alpha});}
function poly2(pts,c,z=0){face(pts.map(p=>[p[0],p[1],z]),c,'floor');}
function box(x,y,w,d,h,c,z=0,type='furn'){
  const a=[x,y,z],b=[x+w,y,z],cc=[x+w,y+d,z],e=[x,y+d,z],A=[x,y,z+h],B=[x+w,y,z+h],D=[x+w,y+d,z+h],E=[x,y+d,z+h];
  face([A,B,D,E],c,type);face([a,b,B,A],c,type);face([b,cc,D,B],c,type);face([cc,e,E,D],c,type);face([e,a,A,E],c,type);
}
function disc(x,y,r,c,z=.04,n=20){let v=[];for(let i=0;i<n;i++){let a=i*2*Math.PI/n;v.push([x+r*Math.cos(a),y+r*Math.sin(a),z])}face(v,c,'floor')}
function cylinder(x,y,r,h,c,z=0,n=18,type='furn'){
  let top=[],bot=[];for(let i=0;i<n;i++){const a=i*2*Math.PI/n;top.push([x+r*Math.cos(a),y+r*Math.sin(a),z+h]);bot.push([x+r*Math.cos(a),y+r*Math.sin(a),z])}face(top,c,type);for(let i=0;i<n;i++)face([bot[i],bot[(i+1)%n],top[(i+1)%n],top[i]],c,type);
}
// The metre coordinates follow the supplied plan's earlier vector reconstruction.
poly2([[4,.0],[13.8,.0],[13.8,10.6],[4.15,10.6],[4.15,9.75],[.9,9.75],[.9,5.7],[2.9,5.7],[2.9,4.1],[4,4.1]],C.floor,-.075);
poly2([[4.24,.24],[8.82,.24],[8.82,4.1],[4.24,4.1]],C.kitchen,-.052);
poly2([[4.16,4.15],[10.47,4.15],[10.47,10.35],[4.16,10.35]],C.living,-.05);
poly2([[1.12,5.95],[3.94,5.95],[3.94,9.49],[1.12,9.49]],C.study,-.048);
poly2([[10.72,.24],[13.54,.24],[13.54,3.96],[10.72,3.96]],C.bed,-.047);
poly2([[10.72,4.24],[13.54,4.24],[13.54,5.72],[10.72,5.72]],C.bath,-.045);
poly2([[10.72,6],[13.54,6],[13.54,10.33],[10.72,10.33]],C.bed,-.046);
// Pale rugs make the open rooms easier to read when viewed from above.
disc(7.52,7.42,1.34,C.rug,-.028,28);disc(7.15,2.65,1.27,'#f0e5d4',-.028,24);
const walls=[
 [4,0,1.05,.24],[6.45,0,.65,1.1],[9.1,0,.9,.24],[10.7,0,.5,.24],[13.3,0,.5,.24],
 [4,.24,.24,.9],[4.24,.9,.46,.3],[4.38,2.4,.32,1.9],[2.9,4.1,1.48,.24],[2.9,4.34,.24,1.46],
 [.9,5.7,1.45,.24],[3.8,5.7,.3,.24],[.9,5.94,.24,3.8],[1.14,9.5,.55,.24],[3.95,6.9,.24,2.6],
 [10.48,10.36,.22,.24],[13.56,10.1,.24,.5],[13.56,.24,.24,.74],[13.2,3.81,.6,.49],[13.56,4.3,.24,1.45],[13.1,5.75,.7,.3],[13.56,9.12,.24,.98],
 [10.48,.24,.24,2.82],[10.72,3.98,.95,.24],[11.67,3.98,1.53,.24],[8.82,.24,.24,4],[9.06,2.91,.52,.18],[9.06,4.06,.48,.18],
 [10.48,4.22,.24,.63],[10.72,5.75,2.38,.24],[10.48,5.99,.24,2.94],[10.48,9.9,.24,.46],[12.47,4.22,.16,1.53]
];
const windows=[[5.05,.12,6.45,.12],[7.1,.12,9.1,.12],[10,.12,10.7,.12],[11.2,.12,13.3,.12],[4.5,1.2,4.5,2.4],[2.35,5.82,3.8,5.82],[1.69,9.62,3.95,9.62],[10.7,10.48,13.56,10.48],[13.68,.98,13.68,3.81],[13.68,6.05,13.68,9.12]];
function makeArchitecture(){
  for(const [x,y,w,d] of walls)box(x,y,w,d,fullWalls?2.45:1.18,C.wall,0,'wall');
  for(const [x,y,X,Y] of windows){const vertical=Math.abs(x-X)<.01;const t=.065;if(vertical)box(x-t/2,Math.min(y,Y),t,Math.abs(Y-y),fullWalls?1.15:.69,C.glass,.28,'glass');else box(Math.min(x,X),y-t/2,Math.abs(X-x),t,fullWalls?1.15:.69,C.glass,.28,'glass')}

  const gh=fullWalls?2.28:1.14,top=fullWalls?2.4:1.26;
  box(4.05,10.42,6.43,.085,gh,C.glass,.1,'glass');
  box(4.06,9.74,.085,.76,gh,C.glass,.1,'glass');
  for(const x of [4.05,5.65,7.25,8.85,10.43])box(x,10.4,.045,.12,top,C.wall,0,'wall');
  box(4.04,9.73,.12,.045,top,C.wall,0,'wall');
  box(4.04,10.4,6.45,.1,.065,C.wall,top,'wall');
}
function bed(x,y,d){box(x,y,2.1,d,.34,C.woodLight,.08);box(x+.1,y+.09,1.74,d-.18,.18,C.linen,.44);box(x+1.55,y+.12,.34,d-.24,.12,C.pillow,.64);box(x+2.04,y,.09,d,.78,C.wood,.07,'furn')}

function makeFurniture(){

  box(6.08,5.92,.6,.6,.43,C.woodLight);box(6.08,8.76,.6,.6,.43,C.woodLight);

  box(1.2,6.01,1.89,.57,.96,C.woodLight);box(1.2,7.83,.62,1.58,.73,C.woodLight);box(2.92,7.84,.65,1.73,.42,C.sofa);box(3.65,7.04,.27,1.58,1.75,C.woodLight);

  bed(11.12,1.32,1.5);box(11.52,3.42,1.81,.52,1.95,C.woodLight);bed(11.1,7.57,1.8);box(11.1,6.1,2.25,.55,1.97,C.woodLight);box(12.94,9.56,.42,.55,.72,C.woodLight);

  box(10.77,4.29,.8,.46,.73,C.fixture);disc(11.18,4.52,.16,C.glass,.76);cylinder(12.02,4.82,.22,.43,C.fixture);box(12.64,4.33,.81,1.29,.52,C.fixture);box(12.7,4.39,.69,1.17,.03,C.glass,.53);

function rebuild(){faces.length=0;makeArchitecture();if(furniture)makeFurniture()}
function vecDot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function cameraBasis(){let cy=Math.cos(cam.yaw),sy=Math.sin(cam.y),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);let eye=[cam.x+sy*cp*25,cam.y+cy*cp*25,sp*25],forward=[-sy*cp,-cy*cp,-sp],right=[cy,-sy,0],up=[-sy*sp,-cy*sp,cp];return{eye,forward,right,up}}
function project(p,b,s){let q=[p[0]-cam.x,p[1]-cam.y,p[2]-.15];return [width*.5+vecDot(q,b.right)*s,height*.53-vecDot(q,b.up)*s]}
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return`rgb(${Math.max(0,Math.min(255,r*f))|0},${Math.max(0,Math.min(255,g*f))|0},${Math.max(0,Math.min(255,b*f))|0})`}
function draw(){
  if(!width||!height)return;cam.yaw+=(target.yaw-cam.yaw)*.16;cam.pitch+=(target.pitch-cam.pitch)*.16;cam.zoom+=(target.zoom-cam.zoom)*.16;cam.x+=(target.x-cam.x)*.16;cam.y+=(target.y-cam.y)*.16;
  ctx.fillStyle='#f3f0ea';ctx.fillRect(0,0,width,height);const b=cameraBasis(),s=Math.min(width/17.5,height/17.7)*cam.zoom;
  const list=faces.map(f=>{let center=[0,0,0];for(let p of f.v){center[0]+=p[0];center[1]+=p[1];center[2]+=p[2]}center=center.map(v=>v/f.v.length);return {...f,depth:vecDot([center[0]-b.eye[0],center[1]-b.eye[1],center[2]-b.eye[2]],b.forward),center}}).sort((a,z)=>z.depth-a.depth);
  for(let f of list){let a=f.v[0],v=f.v[1],c=f.v[2],e1=[v[0]-a[0],v[1]-a[1],v[2]-a[2]],e2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]],normal=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
    // All faces are drawn in depth order; the upper surface stays brightest.
    const bright=Math.abs(normal[2])>.001?1:normal[0]+normal[1]>0?.82:.91;

  }
  if(labels){ctx.textAlign='center';ctx.textBaseline='middle';for(let r of rooms.slice(1)){let [x,y]=project([r.x,r.y,.08],b,s);if(x<25||y<25||x>width-25||y>height-25)continue;ctx.font='600 11px Inter, Microsoft YaHei, sans-serif';let w=Math.max(48,ctx.measureText(r.name).width+20);ctx.fillStyle=active===r.id?'#314b3bdc':'#ffffffd9';ctx.beginPath();ctx.roundRect(x-w/2,y-12,w,24,12);ctx.fill();ctx.fillStyle=active===r.id?'#fff':'#4c5c51';ctx.fillText(r.name,x,y+.5)}}

function size(){let r=canvas.getBoundingClientRect();width=r.width;height=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function select(id){let r=rooms.find(x=>x.id===id);if(!r)return;active=id;document.querySelector('.stage').classList.toggle('focused',id!=='all');target.x=r.x;target.y=r.y;target.zoom=r.zoom;document.querySelectorAll('.room').forEach(el=>el.classList.toggle('active',el.dataset.room===id));document.querySelector('#selectedName').textContent=r.name;document.querySelector('#selectedText').textContent=r.description}
document.querySelector('#rooms').addEventListener('click',e=>{let button=e.target.closest('[data-room]');if(button)select(button.dataset.room)});
function setMode(top){topMode=top;target.pitch=top?Math.PI/2-.005:.94;target.yaw=top?0:-.55;document.querySelector('#mode3d').classList.toggle('active',!top);document.querySelector('#modeTop').classList.toggle('active',top)}
document.querySelector('#mode3d').onclick=()=>setMode(false);document.querySelector('#modeTop').onclick=()=>setMode(true);
document.querySelector('#zoomIn').onclick=()=>target.zoom=Math.min(3.4,target.zoom*1.2);document.querySelector('#zoomOut').onclick=()=>target.zoom=Math.max(.62,target.zoom/1.2);document.querySelector('#reset').onclick=()=>{setMode(false);select('all')};
function toggle(el,cb){el.addEventListener('click',()=>{let on=!el.classList.contains('on');el.classList.toggle('on',on);el.setAttribute('aria-checked',String(on));cb(on)})}
toggle(document.querySelector('#wallToggle'),v=>{fullWalls=v;rebuild()});toggle(document.querySelector('#furnToggle'),v=>{furniture=v;rebuild()});toggle(document.querySelector('#labelToggle'),v=>labels=v);
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,yaw:target.yaw,pitch:target.pitch,id:e.pointerId}});

canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinchDist)target.zoom=Math.max(.62,Math.min(3.4,target.zoom*d/pinchDist));pinchDist=d;drag=null}},{passive:false});canvas.addEventListener('touchend',e=>{for(let t of e.changedTouches)delete touches[t.identifier];if(e.touches.length<2)pinchDist=0});

})();
